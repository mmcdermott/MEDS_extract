# Single MESSY file for the example ETL: carries BOTH the ``sources:`` block that
# ``meds-extract-download`` reads AND the event-conversion config that the MEDS_extract
# pipeline reads. ``MessyConfig.parse`` treats ``sources`` as a reserved top-level key
# (alongside ``_defaults``), so ``convert_to_MEDS_events`` / ``shard_events`` / etc. skip
# it when iterating table definitions.
#
# ``${oc.env:EXAMPLE_RAW_DATA}`` is resolved at CLI-invocation time; the README
# walkthrough + the integration test both set it before running.

sources:
  dataset:
    - type: fsspec
      root: ${oc.env:EXAMPLE_RAW_DATA}
  common:
    - type: physionet
      base_url: https://physionet.org/files/mimic-iv-demo/2.2

# Reserved ``etl:`` block consumed only by ``meds-extract-run`` (issue #170): with it,
# this one file describes the ENTIRE ETL — where the data lives (``sources:``), what to
# extract (the event tables below), and how to run it (this stage list). The stage
# configs mirror ``pipeline.yaml`` exactly, so both invocation styles produce
# bit-identical outputs (``seed`` is omitted: the MEDS-transforms default of 1 matches
# ``pipeline.yaml``'s explicit ``seed: 1``).
etl:
  dataset_name: MEDS_extract_example
  raw_dataset_version: "0.1"
  pipeline:
    - shard_events:
        row_chunksize: 2
        infer_schema_length: 10000
    - split_and_shard_subjects:
        split_fracs:
          train: 0.5
          tuning: 0.25
          held_out: 0.25
        n_subjects_per_shard: 10
    - convert_to_subject_sharded
    - convert_to_MEDS_events:
        do_dedup_text_and_numeric: false
    - merge_to_MEDS_cohort
    - extract_code_metadata
    - finalize_MEDS_metadata
    - finalize_MEDS_data

_defaults:
  subject_id: $patient_id

patients:
  eye_color:
    code: 'f"EYE_COLOR//{$eye_color}"'
    time: null
  hair_color:
    code: 'f"HAIR_COLOR//{$hair_color}"'
    time: null
  dob:
    code: MEDS_BIRTH
    time: '$dob::"%Y-%m-%dT%H:%M:%S"'
  dod:
    code: MEDS_DEATH
    time: '$dod::"%Y-%m-%dT%H:%M:%S"'

labs_vitals:
  _table:
    join:
      stays:
        key: stay_id
        cols: [patient_id]
  lab:
    code: $test_name
    time: '$timestamp::"%Y-%m-%dT%H:%M:%S"'
    numeric_value: $result
    _metadata:
      lab_descriptions:
        test_name: $test_name # join key: name matches the code's component
        description: $description

medications:
  med:
    code: 'f"{$medication_name}//{$dose}"'
    time: '$timestamp::"%Y-%m-%dT%H:%M:%S"'
    _metadata:
      medication_classes:
        # Partial match: only `medication_name` (of the code's two components) is
        # produced, so the class broadcasts to every dose-variant of the medication.
        medication_name: $medication_name
        description: $drug_class

diagnoses:
  dx:
    code: $diagnosis_code
    time: '$timestamp::"%Y-%m-%dT%H:%M:%S"'
